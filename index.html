<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <title>FitNES</title>
    <script>
      // Same formula as nesScale() in src/app/nesScale.ts, so the first paint already fills the width.
      (() => {
        var logical = 256;
        var width = document.documentElement.clientWidth || logical;
        var px = width / logical;
        var style = document.documentElement.style;
        style.setProperty('--px', `${px}px`);
        style.setProperty('--screen', `${width}px`);
        style.setProperty('--screen-left', '0px');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
