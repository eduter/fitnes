<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <title>FitNES</title>
    <script>
      // Same formula as nesScale() in src/app/nesScale.ts, so the first paint is already scaled.
      (() => {
        var logical = 256;
        var width = document.documentElement.clientWidth || logical;
        var dpr = window.devicePixelRatio || 1;
        var device = width * dpr;
        var integer = Math.floor(device / logical);
        var px = device < logical ? width / logical : integer / dpr;
        var screen = device < logical ? width : logical * px;
        var left = device < logical ? 0 : Math.floor((device - logical * integer) / 2) / dpr;
        var style = document.documentElement.style;
        style.setProperty('--px', `${px}px`);
        style.setProperty('--screen', `${screen}px`);
        style.setProperty('--screen-left', `${left}px`);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
