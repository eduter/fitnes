<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="dark" />
        <title>FitNES set transitions</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='3' y='12' width='10' height='2' fill='%23f0bc3c'/%3E%3C/svg%3E" />
        <link rel="stylesheet" href="styles.css" />

            <header class="top">

        <script src="app.js"></script>
