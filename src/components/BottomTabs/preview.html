<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FitNES · Selected tab icons</title>
        <style>
            body { margin: 0; background: #000; color: #d8a082; font: 14px/1.5 system-ui, sans-serif; }
            .tab-preview { max-width: 512px; padding: 16px; margin: auto; }
            h1 { margin: 0 0 12px; font-size: 20px; line-height: 30px; }
            p { margin: 12px 0; line-height: 21px; }
            .tab-preview__viewport, .tab-preview__screen { width: 256px; height: 240px; }
            .tab-preview__gym { display: block; width: 256px; height: 184px; object-fit: cover; object-position: top; image-rendering: pixelated; }
            @media (min-width: 560px) {
                .tab-preview .tab-preview__viewport { width: 512px; height: 480px; }
                .tab-preview .tab-preview__screen { transform: scale(2); transform-origin: top left; }
            }
        </style>
    </head>
    <body>
        <div id="tab-preview"></div>
        <script type="module" src="./BottomTabs.preview.tsx"></script>
    </body>
</html>
