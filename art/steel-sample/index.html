<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitNES steel art sample</title>
    <style>
        html, body { margin: 0; background: #000; }
        body { min-height: 100svh; display: grid; place-items: center; }
        canvas { display: block; position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas width="256" height="240" role="img" aria-label="FitNES art study: riveted steel frames, selected Enter gym row, and a top-down gym with a warm-haired athlete."></canvas>
    <script>
        const source = new Image();
        source.src = './native.png';
        function fitPixels() {
            const dpr = devicePixelRatio;
            const scale = Math.max(1, Math.floor(Math.min(innerWidth * dpr / 256, innerHeight * dpr / 240)));
            const image = document.querySelector('canvas');
            image.width = 256 * scale;
            image.height = 240 * scale;
            const context = image.getContext('2d');
            context.imageSmoothingEnabled = false;
            context.drawImage(source, 0, 0, image.width, image.height);
            image.style.width = `${image.width}px`;
            image.style.height = `${image.height}px`;
            // Transform after layout so fractional CSS units do not change device pixel blocks
            const left = Math.floor((innerWidth * dpr - image.width) / 2) / dpr;
            const top = Math.floor((innerHeight * dpr - image.height) / 2) / dpr;
            image.style.transform = `translate(${left}px, ${top}px) scale(${1 / dpr})`;
        }
        addEventListener('resize', fitPixels);
        source.addEventListener('load', fitPixels);
    </script>
</body>
</html>
