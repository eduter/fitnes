<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FitNES home concept</title><link rel="stylesheet" href="./SteelPanel/SteelPanel.css"><link rel="stylesheet" href="./home.css"></head>
<body><main class="home">
<header><img src="./logo.png" width="256" height="128" alt="FitNES"></header>
<img class="gym" src="../previous/v2/gym-warm.png" width="256" height="200" alt="Lifter training in an industrial gym">
<section class="actions" aria-label="Quick actions">
<button type="button"><span aria-hidden="true">&gt;</span> Start workout</button>
<button type="button"><span aria-hidden="true">+</span> Add weight</button>
</section>
<nav class="steel-panel tabs" aria-label="Main navigation"><div class="steel-panel__frame"><div class="tab-items">
<button type="button" aria-label="Home" aria-current="page"><img src="./home.png" width="24" height="24" alt=""></button>
<button type="button" aria-label="Workout"><img src="./train.png" width="24" height="24" alt=""></button>
<button type="button" aria-label="Log"><img src="./log.png" width="24" height="24" alt=""></button>
<button type="button" aria-label="Progress"><img src="./stats.png" width="24" height="24" alt=""></button>
<button type="button" aria-label="Settings"><img src="./setup.png" width="24" height="24" alt=""></button>
</div></div></nav>
</main></body>
</html>
